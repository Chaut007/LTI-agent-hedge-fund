[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hedge-fund"
version = "0.1.0"
description = "Multi-agent systematic equity strategy, US large caps, daily rebalance"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.1",
    "numpy>=1.26",
    "pyarrow>=15.0",
    "duckdb>=0.10",
    "requests>=2.31",
    "yfinance>=0.2.40",
    "scipy>=1.11",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[project.scripts]
hf = "hedge_fund.cli:main"

[tool.setuptools.packages.find]
include = ["hedge_fund*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
