name: tests

# The whole suite is designed to run without network access: every fixture is
# synthetic or on disk, and the two modules that do reach the internet
# (yfinance, SEC EDGAR) are tested against mocked responses. Running it here on
# a clean runner is what keeps that true — a test that quietly started calling
# out would pass locally and fail here.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# A new push makes an in-flight run on the same branch pointless.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.11 is the floor declared in pyproject; 3.12 catches anything that
        # depends on a version-specific detail. pandas 3 and numpy 2 are recent
        # enough that this is a real check, not a formality.
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"

      - name: Report the versions the run actually used
        # Printed because three defects in this repo's history were
        # version-dependent: pandas 3 returning `date` where 2 returned
        # `Timestamp`, DuckDB handing back Timestamps, and an int64/float64
        # split that changed the stored parquet schema between batches.
        run: |
          python -c "import sys, pandas, numpy, duckdb, pyarrow; \
            print(f'python  {sys.version.split()[0]}'); \
            print(f'pandas  {pandas.__version__}'); \
            print(f'numpy   {numpy.__version__}'); \
            print(f'duckdb  {duckdb.__version__}'); \
            print(f'pyarrow {pyarrow.__version__}')"

      - name: Run the suite
        run: pytest -q

      - name: Check the CLI starts and reports its biases
        # `hf status` on an empty lake exercises the cold-read path, which has
        # its own defect history: it used to return object dtype for every
        # column, so an agent run before any ingest produced nan scores instead
        # of failing.
        env:
          HF_LAKE_DIR: ${{ runner.temp }}/empty-lake
        run: |
          hf --help > /dev/null
          hf status
